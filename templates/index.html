<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AngelTier Leaderboard - MCO Code 004</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes pulseGlow {
            0%, 100% { box-shadow: 0 0 15px rgba(168, 85, 247, 0.4); }
            50% { box-shadow: 0 0 25px rgba(168, 85, 247, 0.8); }
        }
        .animate-fade-in {
            animation: fadeIn 0.5s ease-out forwards;
        }
        .glow-card {
            animation: pulseGlow 3s infinite;
        }
        body {
            background: #0f172a;
            color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between">
    <!-- Header -->
    <header class="bg-slate-900/80 backdrop-blur-md border-b border-slate-800 sticky top-0 z-50 px-6 py-4 flex justify-between items-center shadow-lg">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 rounded-full bg-purple-600 flex items-center justify-center font-bold text-xl glow-card">AT</div>
            <div>
                <h1 class="text-xl font-bold tracking-wider text-purple-400">ANGEL TIER</h1>
                <p class="text-xs text-slate-400"># made by MCO (mr.coco own web)</p>
            </div>
        </div>
        <button onclick="toggleAdminModal()" class="text-xs bg-slate-800 hover:bg-slate-700 text-purple-300 border border-purple-500/30 px-4 py-2 rounded-lg transition-all shadow-md">
            ⚙️ Quản Trị Viên
        </button>
    </header>

    <!-- Main Content -->
    <main class="max-w-4xl mx-auto w-full p-6 my-8 animate-fade-in">
        <div class="text-center mb-8">
            <h2 class="text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-pink-500">Bảng Xếp Hạng Kỹ Năng</h2>
            <p class="text-sm text-slate-400 mt-2">Đồng bộ trực tiếp từ cơ sở dữ liệu Supabase</p>
        </div>

        <div class="bg-slate-900/60 backdrop-blur-md border border-slate-800 rounded-2xl shadow-xl overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-800/80 text-slate-300 text-xs uppercase tracking-wider border-b border-slate-700">
                            <th class="py-4 px-6 text-center">Hạng</th>
                            <th class="py-4 px-6">Người Chơi</th>
                            <th class="py-4 px-6">Tier Chi Tiết</th>
                            <th class="py-4 px-6 text-right">Tổng Điểm</th>
                        </tr>
                    </thead>
                    <tbody id="leaderboard-body" class="divide-y divide-slate-800/50 text-sm">
                        <!-- Dữ liệu được render qua JavaScript -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="text-center py-6 text-xs text-slate-500 border-t border-slate-800/60">
        &copy; 2026 AngelTier System. Designed and coded by MCO.
    </footer>

    <!-- Script xử lý hiển thị dữ liệu -->
    <script>
        async function fetchLeaderboard() {
            try {
                const res = await fetch('/api/leaderboard');
                const data = await res.json();
                const tbody = document.getElementById('leaderboard-body');
                tbody.innerHTML = '';

                data.forEach((player, index) => {
                    let rankBadge = `<span class="font-bold text-slate-400">#${index + 1}</span>`;
                    if (index === 0) rankBadge = `<span class="inline-block px-2 py-1 bg-yellow-500/20 text-yellow-400 rounded-full font-bold text-xs">🥇 #1</span>`;
                    else if (index === 1) rankBadge = `<span class="inline-block px-2 py-1 bg-slate-300/20 text-slate-300 rounded-full font-bold text-xs">🥈 #2</span>`;
                    else if (index === 2) rankBadge = `<span class="inline-block px-2 py-1 bg-amber-600/20 text-amber-500 rounded-full font-bold text-xs">🥉 #3</span>`;

                    let tiersHtml = '';
                    for (const [mode, tier] of Object.entries(player.tiers)) {
                        tiersHtml += `<span class="inline-block bg-purple-900/40 text-purple-300 border border-purple-700/50 px-2 py-0.5 rounded text-xs mr-1 mb-1 font-semibold">${mode}: ${tier}</span>`;
                    }

                    const row = `
                        <tr class="hover:bg-slate-800/40 transition-colors">
                            <td class="py-4 px-6 text-center whitespace-nowrap">${rankBadge}</td>
                            <td class="py-4 px-6 flex items-center space-x-3 whitespace-nowrap">
                                <img src="${player.avatar}" alt="${player.name}" class="w-8 h-8 rounded-lg bg-slate-800">
                                <span class="font-medium text-slate-200">${player.name}</span>
                            </td>
                            <td class="py-4 px-6">${tiersHtml || '<span class="text-slate-500 italic">Chưa có Tier</span>'}</td>
                            <td class="py-4 px-6 text-right font-bold text-purple-400 whitespace-nowrap">${player.points} pts</td>
                        </tr>
                    `;
                    tbody.innerHTML += row;
                });
            } catch (err) {
                console.error("Lỗi tải bảng xếp hạng:", err);
            }
        }

        function toggleAdminModal() {
            window.location.href = '#admin-login-placeholder'; // Có thể liên kết trang quản trị riêng nếu có
            alert("Vui lòng truy cập thông qua các endpoint API Admin hoặc tích hợp Panel trực tiếp tại đây.");
        }

        document.addEventListener('DOMContentLoaded', fetchLeaderboard);
    </script>
</body>
</html>
